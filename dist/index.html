<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03050b">
  <meta name="description" content="Đức Anh — Full Stack Developer. Khám phá portfolio qua một hệ hành tinh 3D.">
  <title>Đức Anh — Full Stack Developer</title>
  <link rel="icon" href="assets/avatar.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js" defer></script>
  <script src="assets/vendor/three.min.js" defer></script>
  <script src="assets/scene.js" defer></script>
  <script src="assets/main.js" defer></script>
</head>
<body class="is-loading">
  <div id="space" class="space"></div>
  <div class="space-fx" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Về trang đầu">
      <span class="brand-mark">ĐA</span>
      <span class="brand-text"><strong data-bind="name"></strong><small data-bind="role"></small></span>
    </a>
    <nav class="nav" aria-label="Các mục">
      <a href="#about" data-key="about"><i></i>Giới thiệu</a>
      <a href="#skills" data-key="skills"><i></i>Kỹ năng</a>
      <a href="#projects" data-key="projects"><i></i>Dự án</a>
      <a href="#experience" data-key="experience"><i></i>Kinh nghiệm</a>
      <a href="#contact" data-key="contact"><i></i>Liên hệ</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <p class="hero-status"><span class="pulse"></span><span data-bind="status"></span></p>
      <h1 id="hero-title" class="hero-title">
        <span class="reveal">Xin chào, mình là</span>
        <span class="reveal hero-name" data-bind="name"></span>
      </h1>
      <p class="hero-role reveal"><span data-bind="role"></span></p>
      <p class="hero-text reveal" data-bind="tagline"></p>
      <div class="hero-actions reveal">
        <a class="btn btn-primary" href="#projects">Xem dự án <span aria-hidden="true">→</span></a>
        <a class="btn btn-ghost" href="#about">Về mình</a>
      </div>
    </section>

    <div class="planet-tags" aria-label="Các hành tinh"></div>
    <p class="hint"><span class="hint-dot"></span>Chạm vào một hành tinh để khám phá</p>

    <aside class="panel" aria-hidden="true" aria-labelledby="panel-title" tabindex="-1">
      <div class="panel-head">
        <div>
          <p class="panel-kicker"><span class="panel-num"></span><span class="panel-planet"></span></p>
          <h2 id="panel-title" class="panel-title"></h2>
        </div>
        <button class="icon-btn panel-close" aria-label="Đóng và quay về hệ hành tinh">✕</button>
      </div>
      <div class="panel-body"></div>
      <div class="panel-foot">
        <button class="foot-btn prev"><span aria-hidden="true">←</span><span class="foot-label"></span></button>
        <button class="foot-btn next"><span class="foot-label"></span><span aria-hidden="true">→</span></button>
      </div>
    </aside>
  </main>

  <div class="loader" role="status">
    <div class="loader-ring"></div>
    <p>Đang mở cánh cửa vũ trụ… <span class="loader-pct">0%</span></p>
  </div>

  <dialog id="project-dialog" aria-labelledby="pd-title">
    <button class="icon-btn dialog-close" aria-label="Đóng">✕</button>
    <div class="dialog-body"></div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
  <p class="credit">Planet maps: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> · CC BY 4.0</p>
  <noscript><p style="padding:2rem;color:#fff">Vui lòng bật JavaScript để xem portfolio.</p></noscript>
</body>
</html>
